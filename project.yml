name: RecallNative
options:
  bundleIdPrefix: com.recalllabs
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  groupSortPosition: top
  generateEmptyDirectories: true
settings:
  base:
    DEVELOPMENT_TEAM: AGYVQ59A5S
    CODE_SIGN_STYLE: Manual
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.1.0"
packages:
  RecallOnDeviceAI:
    url: https://github.com/rorshopping/recall-ondevice-ai.git
    # Pinned to a tagged release so Swift 6 concurrency-safe storage
    # (nonisolated(unsafe) on ExperimentalFlags, @unchecked Sendable on
    # Conversation/StreamContext, nonisolated deinit on Engine) is present.
    exactVersion: 0.1.4
targets:
  RecallNative:
    type: application
    platform: iOS
    sources: [RecallNative]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.recalllabs.recallnative
      SWIFT_VERSION: 6.0
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: Recall Native
      INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
      INFOPLIST_KEY_BGTaskSchedulerPermittedIdentifiers:
        - com.recalllabs.recallnative.ai-import.*
      # Keep the native rewrite aligned with the original app's default
      # orientation behavior instead of silently locking phones to portrait.
      INFOPLIST_KEY_UISupportedInterfaceOrientations:
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationPortraitUpsideDown
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
      # Provide a launch screen so the iOS scene gets a real UIWindow frame
      # sized to the device's full screen. Without this, some iOS 26 builds
      # boot the app into a smaller window with black bars top/bottom.
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      CODE_SIGN_ENTITLEMENTS: RecallNative/RecallNative.entitlements
    dependencies:
      - package: RecallOnDeviceAI
        product: RecallLiteRT
  RecallNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RecallNativeTests]
    dependencies:
      - target: RecallNative
  RecallNativeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [RecallNativeUITests]
    dependencies:
      - target: RecallNative
